<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#04060a" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex" />
<title>Email confirmed — Streak</title>
<style>
:root{
  --void:#04060a;
  --silver:#b9c2ce;
  --white:#f2f5f9;
  --blue:#58a6ff;
  --blue-hi:#9ccbff;
  --green:#3ddc84;
  --red:#f87171;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.9,.24,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--void);color:var(--white);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100svh;padding:40px 22px;position:relative;overflow-x:hidden}
a{color:inherit}
#field{position:fixed;inset:0;z-index:0;opacity:.5}
#glow{position:fixed;left:50%;top:38%;width:min(900px,120vw);aspect-ratio:1;
  transform:translate(-50%,-50%);z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(88,166,255,.16),rgba(88,166,255,0) 70%)}
main{position:relative;z-index:2;width:100%;max-width:420px;text-align:center;
  padding:clamp(30px,6vw,46px) clamp(22px,5vw,40px) clamp(26px,5vw,38px);
  border-radius:26px;
  background:linear-gradient(180deg,rgba(21,27,35,.82),rgba(11,15,21,.78));
  border:1px solid rgba(185,194,206,.14);
  box-shadow:0 50px 90px -50px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);
  animation:rise .8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.logo{width:64px;height:64px;margin:0 auto 22px;display:block}
.label{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--green);margin-bottom:14px}
.label.error{color:var(--red)}
h1{font-size:clamp(24px,5.5vw,32px);font-weight:800;line-height:1.2;letter-spacing:-.4px;color:var(--white);margin:0 0 12px}
p{color:var(--silver);line-height:1.6;font-size:15px;margin:0}
.actions{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 22px;border-radius:14px;text-decoration:none;
  font-size:15px;font-weight:700}
.btn.primary{background:var(--white);color:#06090e}
.btn.ghost{background:rgba(255,255,255,.045);color:var(--white);border:1px solid rgba(185,194,206,.18)}
footer{position:relative;z-index:2;margin-top:22px;text-align:center;
  font-size:11.5px;line-height:1.8;color:rgba(185,194,206,.55);max-width:420px}
footer a{color:rgba(185,194,206,.85);text-decoration:none;border-bottom:1px solid rgba(185,194,206,.25)}
footer .sep{opacity:.4;margin:0 8px}
@media (prefers-reduced-motion:reduce){main{animation:none}#field{display:none}}
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="glow"></div>

<main role="main" id="content">
  <img class="logo" src="/streak-logo-white.png" width="64" height="64" alt="Streak" />
  <p class="label">All set</p>
  <h1>Email confirmed</h1>
  <p>Your account is ready. Open the Streak app and sign in to continue.</p>
  <div class="actions">
    <a class="btn primary" id="openApp" href="streak://">Open Streak</a>
  </div>
</main>

<footer>
  Need a hand? <a href="https://streakofficial.com/#support">Support</a>
  <span class="sep">·</span>
  <a href="https://streakofficial.com/#privacy">Privacy</a>
  <span class="sep">·</span>
  <a href="https://streakofficial.com/#terms">Terms</a>
  <br>Streak is a support tool, not a treatment or a guarantee.
</footer>

<script>
/* ---- deep link with app-store fallback ---- */
const APP_SCHEME = 'streak://';
const STORE_URL  = 'https://apps.apple.com/au/app/streak-quit-gambling/id6782550146';

function wireOpenButton(){
  const btn = document.getElementById('openApp');
  if(!btn) return;
  btn.href = STORE_URL;
  btn.addEventListener('click', e => {
    const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if(!mobile) return;
    e.preventDefault();
    let bailed = false;
    const bail = () => { bailed = true; };
    document.addEventListener('visibilitychange', bail, {once:true});
    window.addEventListener('pagehide', bail, {once:true});
    location.href = APP_SCHEME;
    setTimeout(() => { if(!bailed) location.href = STORE_URL; }, 1400);
  });
}
wireOpenButton();

/* ---- preserved from the working page: show an error state if Supabase
   redirected here with an error in the URL hash/query ---- */
const params = new URLSearchParams(location.hash.slice(1) || location.search);
const error = params.get('error') || params.get('error_code');
if (error) {
  const card = document.getElementById('content');
  card.innerHTML =
    '<img class="logo" src="/streak-logo-white.png" width="64" height="64" alt="Streak" />' +
    '<p class="label error">Something went wrong</p>' +
    '<h1>Link expired</h1>' +
    '<p>This confirmation link is invalid or has already been used. ' +
    'Open the Streak app and sign in, or sign up again to get a new link.</p>' +
    '<div class="actions"><a class="btn primary" id="openApp" href="streak://">Open Streak</a></div>';
  wireOpenButton();
}

/* ---- ambient constellation (decorative, pure canvas, no external assets) ---- */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('field'), x = c.getContext('2d');
  let w, h, dpr, pts;
  function size(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    const n = Math.round(Math.min(90, innerWidth / 14));
    pts = Array.from({length:n}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx:(Math.random()-.5)*.14*dpr, vy:(Math.random()-.5)*.14*dpr,
      r:(Math.random()*1.3+.5)*dpr
    }));
  }
  function frame(){
    x.clearRect(0,0,w,h);
    for(const p of pts){
      p.x += p.vx; p.y += p.vy;
      if(p.x<0||p.x>w) p.vx*=-1;
      if(p.y<0||p.y>h) p.vy*=-1;
    }
    const lim = 130*dpr;
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const a=pts[i], b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
        if(d<lim){
          x.strokeStyle = 'rgba(88,166,255,'+(.16*(1-d/lim)).toFixed(3)+')';
          x.lineWidth = dpr*.6;
          x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke();
        }
      }
    }
    for(const p of pts){
      x.fillStyle = 'rgba(185,210,255,.55)';
      x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill();
    }
    requestAnimationFrame(frame);
  }
  size(); addEventListener('resize', size); frame();
})();
</script>
</body>
</html>
