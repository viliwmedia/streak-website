<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000004" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Email confirmed — Streak</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000004;
      color: #e8edf5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; width: 100%; }
    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
      display: block;
    }
    .label {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #6b7a94;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.4px;
      margin: 0 0 12px;
    }
    p {
      color: #8b95a8;
      line-height: 1.55;
      font-size: 15px;
      margin: 0;
    }
    a.btn {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 28px;
      background: #c8d8f0;
      color: #000004;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
    }
    .error h1 { color: #f87171; }
    .error .label { color: #f87171; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card" id="content">
    <img class="logo" src="/streak-logo-white.png" width="96" height="96" alt="Streak" />
    <p class="label">All set</p>
    <h1>Email confirmed</h1>
    <p>Your account is ready. Open the Streak app and sign in to continue.</p>
    <a class="btn" href="streak://">Open Streak</a>
  </div>
  <script>
    const params = new URLSearchParams(location.hash.slice(1) || location.search);
    const error = params.get('error') || params.get('error_code');
    if (error) {
      const card = document.getElementById('content');
      card.className = 'card error';
      card.innerHTML =
        '<img class="logo" src="/streak-logo-white.png" width="96" height="96" alt="Streak" />' +
        '<p class="label">Something went wrong</p>' +
        '<h1>Link expired</h1>' +
        '<p>This confirmation link is invalid or has already been used. ' +
        'Open the Streak app and sign in, or sign up again to get a new link.</p>' +
        '<a class="btn" href="streak://">Open Streak</a>';
    }
  </script>
</body>
</html>
